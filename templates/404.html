
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/404.css') }}">
</head>
<body class="error-page">
    <main class="error-card">
        <img
            src="{{ url_for('static', filename='images/Assignment-Tracker-logo.png') }}"
            alt="Assignment Tracker Logo"
            class="error-logo"
        >

        <p class="error-code">404</p>

        <h1 class="error-title">Page Not Found</h1>

        <p class="error-message">
            Sorry, we couldn't find the page you're looking for.
            It may have been moved or the link may be incorrect.
        </p>

        <a href="{{ url_for('main.landing') }}" class="error-button">
            Back to Home
        </a>
    </main>
</body>
</html>
